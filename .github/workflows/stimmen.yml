name: Stimmen erzeugen

on:
  workflow_dispatch:
    inputs:
      only_missing:
        description: "Nur fehlende Aufnahmen erzeugen"
        type: boolean
        default: true
      only_keys:
        description: "Nur diese Aufnahmen neu (z. B. laut_t,laut_p) – leer = alle"
        required: false
        default: ""
      voice_id:
        description: "ElevenLabs Voice-ID (Standard: Carlotta)"
        required: false
        default: "hSzY2zmYNQPukJaIll7k"
      model_id:
        description: "ElevenLabs Modell"
        required: false
        default: "eleven_multilingual_v2"

permissions:
  contents: write

concurrency:
  group: stimmen
  cancel-in-progress: false

jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aufnahmen erzeugen
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID: ${{ inputs.voice_id }}
          MODEL_ID: ${{ inputs.model_id }}
          ONLY_MISSING: ${{ inputs.only_missing }}
          ONLY_KEYS: ${{ inputs.only_keys }}
        run: python3 tools/make_voices.py
      - name: Ins Repo übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add audio
          git diff --cached --quiet && echo "Keine Änderungen." && exit 0
          git commit -m "Stimmen aktualisiert"
          git push
