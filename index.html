<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Funkels Lesereise</title>
<style>
:root{
  --night1:#0e0b2b; --night2:#2a1b5e; --night3:#5a3a8a; --glow:#ffd98a; --gold:#ffc94d;
  --ink:#2b2350; --light:#f3ecff; --soft:#b9aee0;
  --c1:#2f6fd0; --c2:#d8483d; --stone:#fff8e7;
  --u:min(1vw,1.6vh);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:manipulation}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,sans-serif;
  color:var(--light);background:linear-gradient(180deg,var(--night1) 0%,var(--night2) 55%,var(--night3) 100%)}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}

/* night sky behind everything */
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#sky i{position:absolute;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite}
#sky .moon{position:absolute;right:9vw;top:5vh;width:calc(var(--u)*9);height:calc(var(--u)*9);border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fffdf0,#ffe9a8 60%,#f5cf78);box-shadow:0 0 6vh 1.5vh rgba(255,225,150,.35)}
#sky .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:34vh}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--u)*2)}
.screen.on{display:flex;animation:fadein .5s}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.round{border-radius:50%;background:rgba(255,255,255,.1);border:.3vh solid rgba(255,225,160,.45);
  box-shadow:0 0 3vh rgba(255,217,138,.25),inset 0 0 2vh rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:center;transition:transform .12s}
.round:active{transform:scale(.93)}
.orb{background:radial-gradient(circle at 35% 30%,#fff6d6,#ffd98a 55%,#e9a93a);border:0;color:var(--ink);
  box-shadow:0 0 5vh 1vh rgba(255,217,138,.45)}
.tile{background:var(--stone);color:var(--ink);border-radius:calc(var(--u)*3.2);min-width:calc(var(--u)*21);height:calc(var(--u)*24);
  padding:0 calc(var(--u)*3);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--u)*13);font-weight:800;letter-spacing:.02em;line-height:1;
  box-shadow:0 .8vh 0 rgba(10,6,40,.45),0 0 4vh rgba(255,225,160,.22);
  transition:transform .15s,opacity .3s,background .2s;touch-action:none}
.tile:active{transform:scale(.95)}
.tile.good{background:#fff0bd;box-shadow:0 0 0 .8vh var(--gold),0 0 7vh 2vh rgba(255,201,77,.6);animation:hop .5s}
.tile.dim{opacity:.3}
.tile.wob{animation:wob .45s}
.cA{color:var(--c1)} .cB{color:var(--c2)}
.funkel{filter:drop-shadow(0 0 2.5vh rgba(255,235,190,.55))}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-3vh)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6vh)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* start */
#start .funkel{width:min(44vw,50vh);animation:float 3s ease-in-out infinite}
.go{width:calc(var(--u)*22);height:calc(var(--u)*22);margin-top:2vh;animation:pulse 1.8s infinite}
.go svg{width:42%;fill:var(--ink);margin-left:6%}

/* story */
#story{justify-content:center;gap:3vh}
#storyArt{position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center;gap:3vw}
#storyArt .funkel{margin-top:16vh;width:min(30vw,36vh);animation:float 3s ease-in-out infinite}
#storyArt .emo{font-size:calc(var(--u)*20);line-height:1;filter:drop-shadow(0 0 2vh rgba(255,235,190,.4))}
#storyArt .emo.sm{font-size:calc(var(--u)*12)}
.sl{position:absolute;font-weight:800;color:var(--gold);font-size:calc(var(--u)*9);
  text-shadow:0 0 2vh rgba(255,201,77,.9),0 0 5vh rgba(255,201,77,.5);animation:float 3.2s ease-in-out infinite}
.sl.blow{animation:blow 3.5s ease-in forwards}
.sl.wake{position:static;font-size:calc(var(--u)*15);animation:wake 1.2s ease-out backwards,float 3.2s ease-in-out 1.2s infinite}
@keyframes blow{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(-120vw,-30vh) rotate(-540deg);opacity:0}}
@keyframes wake{from{opacity:0;transform:scale(.2) rotate(-40deg)}to{opacity:1;transform:scale(1)}}
#story .go{width:calc(var(--u)*16);height:calc(var(--u)*16);margin:0 0 2vh}

/* home */
#home{justify-content:flex-end;padding-bottom:4vh}
#home .top{position:absolute;top:2vh;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 3vw;z-index:2}
.stars{font-size:calc(var(--u)*5);font-weight:800;display:flex;align-items:center;gap:.4em}
.stars b{color:var(--gold);font-size:1.25em;text-shadow:0 0 2vh rgba(255,201,77,.8)}
.gear{width:calc(var(--u)*7);height:calc(var(--u)*7);opacity:.4;font-size:calc(var(--u)*3.8)}
#letterSky{position:absolute;inset:0}
#letterSky button{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:calc(var(--u)*6);color:var(--gold);
  width:calc(var(--u)*9);height:calc(var(--u)*9);
  text-shadow:0 0 1.6vh rgba(255,201,77,.95),0 0 4vh rgba(255,201,77,.5);animation:float 3.4s ease-in-out infinite}
#letterSky button.off{color:rgba(255,255,255,.22);text-shadow:none;font-size:calc(var(--u)*3);animation:none;pointer-events:none}
#letterSky button.new{animation:wake 1.2s ease-out backwards,float 3.4s ease-in-out 1.2s infinite}
#home .funkel{width:min(19vw,24vh);margin-bottom:1vh;animation:float 3s ease-in-out infinite;position:relative}
#home .row{display:flex;gap:calc(var(--u)*3.5);align-items:flex-end;justify-content:center;position:relative}
.station{display:flex;flex-direction:column;align-items:center;gap:1vh}
.station .round{width:calc(var(--u)*17);height:calc(var(--u)*17);font-size:calc(var(--u)*8.5)}
.station .lbl{font-size:calc(var(--u)*4.2);font-weight:800;letter-spacing:.06em;color:var(--light);text-shadow:0 0 1.5vh rgba(0,0,0,.6)}
.station.fresh .round{animation:pulse 1.8s infinite;border-color:var(--gold)}

/* game */
#game{justify-content:space-between;padding-top:2vh;padding-bottom:4vh}
#game .bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 2vw}
.hb{width:calc(var(--u)*10);height:calc(var(--u)*10);font-size:calc(var(--u)*5.2)}
.prog{display:flex;gap:1.2vw;font-size:calc(var(--u)*6.5)}
.prog span{color:rgba(255,255,255,.16);transition:color .3s,transform .3s,text-shadow .3s}
.prog span.got{color:var(--gold);transform:scale(1.25);text-shadow:0 0 2vh rgba(255,201,77,.9)}
.flystar{position:fixed;z-index:9;color:var(--gold);font-size:calc(var(--u)*7);pointer-events:none;
  text-shadow:0 0 2.5vh rgba(255,201,77,1);transition:transform .8s cubic-bezier(.3,.7,.3,1),opacity .8s}
#stage{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh}
.ask{display:flex;align-items:center;justify-content:center;gap:3vw;min-height:calc(var(--u)*26)}
.spk{width:calc(var(--u)*22);height:calc(var(--u)*22);font-size:calc(var(--u)*11)}
.spk.sm{width:calc(var(--u)*13);height:calc(var(--u)*13);font-size:calc(var(--u)*6.5)}
.bigpic{font-size:calc(var(--u)*22);line-height:1;filter:drop-shadow(0 0 2.5vh rgba(255,235,190,.45))}
.opts{display:flex;gap:3.5vw;justify-content:center;flex-wrap:wrap}
.word{display:flex;gap:1vw}
.word .tile{min-width:0;font-size:calc(var(--u)*13*var(--ws,1));padding:0 calc(var(--u)*2.6*var(--ws,1))}
.arrow{font-size:calc(var(--u)*8);width:calc(var(--u)*14);height:calc(var(--u)*14);animation:pulse 1.4s infinite}
.blend{display:flex;align-items:center;gap:6vw;position:relative}
.blend.merged{gap:0}
.blend.merged .arrow{display:none}
.blend.merged .tile{min-width:0;padding:0 calc(var(--u)*1.2);box-shadow:none;background:transparent}
.blend.merged{background:#fff0bd;border-radius:calc(var(--u)*3.2);padding:0 calc(var(--u)*3);
  box-shadow:0 0 0 .8vh var(--gold),0 0 7vh 2vh rgba(255,201,77,.6);animation:hop .5s}

/* done */
#done .funkel{width:min(34vw,40vh);animation:hop 1s infinite}
#done .big{font-size:calc(var(--u)*11);color:var(--gold);letter-spacing:.1em;margin:2vh 0;text-shadow:0 0 3vh rgba(255,201,77,.9)}
#done .go{width:calc(var(--u)*18);height:calc(var(--u)*18);font-size:calc(var(--u)*8)}
.conf{position:absolute;bottom:-8vh;font-size:calc(var(--u)*5);animation:rise ease-out forwards;pointer-events:none;
  filter:drop-shadow(0 0 1.5vh rgba(255,201,77,.9))}
@keyframes rise{to{transform:translateY(-120vh) rotate(200deg);opacity:.2}}

/* unicorns */
.uni{overflow:visible;display:block}
.uni .spk4{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(45deg)}}
.uni .wing{animation:flap 1.6s ease-in-out infinite}
.uni .wing.far{animation-delay:-.25s}
.uni.flying .wing{animation-duration:.45s}
@keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(-13deg)}}
.uni .aura{animation:aura 3s ease-in-out infinite} @keyframes aura{50%{opacity:.5}}
.uni.happy{animation:hop .55s ease-in-out 4}
.flip{transform:scaleX(-1)}
.uni.flip.happy{animation:hopflip .55s ease-in-out 4} @keyframes hopflip{0%,100%{transform:scaleX(-1)}40%{transform:scaleX(-1) translateY(-3vh)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
#fx span{position:absolute;left:0;top:0;line-height:1;will-change:transform,opacity}
.flyby{position:fixed;left:0;width:min(17vw,22vh);pointer-events:none;z-index:8}
#drift{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#drift .d{position:absolute;left:0;width:min(11vw,14vh);opacity:.85;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
#drift .d.back{animation-name:driftb} @keyframes driftb{from{transform:translateX(120vw)}to{transform:translateX(-20vw)}}
#btnMeadow{width:calc(var(--u)*11);height:calc(var(--u)*11);font-size:calc(var(--u)*6);position:relative}
#btnMeadow b{position:absolute;right:-.3em;top:-.3em;background:var(--gold);color:var(--ink);border-radius:1em;font-size:.45em;padding:.15em .45em}
/* meadow */
#meadow{justify-content:flex-start;padding-top:2vh}
#meadow .bar{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 2vw}
#meadow .count{font-size:calc(var(--u)*5);font-weight:800;color:var(--gold);text-shadow:0 0 2vh rgba(255,201,77,.8)}
.pasture{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vh 2vw;width:94vw;margin-top:1vh}
.pen{position:relative;height:19vh;display:flex;align-items:flex-end;justify-content:center}
.pen .cl{position:absolute;bottom:0;left:4%;right:4%;height:5.5vh;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.95),rgba(235,225,255,.55) 55%,transparent 72%)}
.pen .uni{height:100%;width:auto;position:relative;animation:float 3s ease-in-out infinite}
.pen .uni.flip{animation:floatflip 3s ease-in-out infinite} @keyframes floatflip{0%,100%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-1.6vh)}}
.pen.locked .uni{filter:brightness(0) opacity(.22);animation:none}
.pen.locked::after{content:'?';position:absolute;top:30%;font-size:6vh;font-weight:800;color:rgba(255,255,255,.35)}
/* story scenes */
#storyArt.scenehost{display:block;position:relative;align-self:stretch}
.scene{position:absolute;inset:0;overflow:hidden}
.scene .host{position:absolute;left:4%;bottom:4%;width:min(25vw,32vh);z-index:3}
.scene .arrive{position:absolute;right:8%;bottom:6%;width:min(42vw,54vh);z-index:3}
.scene .uni{width:100%}
#btnStory.wait{opacity:.15;pointer-events:none;transition:opacity .6s}
.sc-flyin .arrive,.sc-aurora .arrive{animation:flyin 2.8s cubic-bezier(.2,.7,.3,1) both}
@keyframes flyin{0%{transform:translate(-120vw,-45vh) rotate(-12deg)}70%{transform:translate(4vw,-7vh) rotate(5deg)}100%{transform:none}}
.sc-fall .arrive{animation:fall 2.6s cubic-bezier(.3,.6,.3,1) both}
@keyframes fall{0%{transform:translate(35vw,-95vh) scale(.2) rotate(30deg)}80%{transform:translate(0,-4vh) scale(1.05) rotate(-3deg)}100%{transform:none}}
.moonp{position:absolute;right:15%;bottom:16%;width:min(34vw,44vh);aspect-ratio:1;border-radius:50%;z-index:4;
  background:radial-gradient(circle at 35% 35%,#fffdf0,#ffe9a8 60%,#f5cf78);box-shadow:0 0 9vh 3vh rgba(255,225,150,.5);animation:moonmove 3.2s ease-in-out both}
@keyframes moonmove{0%,35%{transform:none}100%{transform:translate(-22vw,-26vh) scale(.4);opacity:.8}}
.sc-moon .arrive{animation:peek 3.2s ease-out both}
@keyframes peek{0%,30%{transform:scale(.55) translateX(-4vw);opacity:0}45%{opacity:1}100%{transform:none;opacity:1}}
.cloudp{position:absolute;right:2%;bottom:0;width:min(52vw,66vh);z-index:4;animation:wob .55s 3,poof .7s 1.8s forwards}
@keyframes poof{to{transform:scale(1.7);opacity:0}}
.sc-cloud .arrive{animation:popin 2.8s ease-out both}
@keyframes popin{0%,58%{transform:scale(.6);opacity:0}76%{transform:scale(1.12);opacity:1}100%{transform:none}}
.growp{position:absolute;right:18%;bottom:10%;font-size:min(30vw,38vh);line-height:1;z-index:4;animation:grow 2.8s ease-out forwards;
  filter:drop-shadow(0 0 3vh rgba(255,240,200,.8))}
@keyframes grow{0%{transform:scale(0)}50%{transform:scale(1)}66%{transform:scale(1.18);opacity:1}80%{transform:scale(.2);opacity:0}100%{opacity:0;transform:scale(0)}}
.flash{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(circle at 70% 60%,#fff,rgba(255,255,255,0) 60%);opacity:0;animation:flash 3s forwards}
@keyframes flash{0%,58%{opacity:0}66%{opacity:.95}100%{opacity:0}}
.sc-grow .arrive{animation:popin2 3s ease-out both}
@keyframes popin2{0%,66%{transform:scale(0);opacity:0}80%{transform:scale(1.15);opacity:1}100%{transform:none}}
.rainbowp{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.rainbowp path{fill:none;stroke-linecap:round;stroke-dasharray:200;stroke-dashoffset:200;animation:draw 1.6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sc-rainbow .arrive{animation:slide 3.4s ease-in-out both}
@keyframes slide{0%,38%{transform:translate(-60vw,-52vh) rotate(24deg);opacity:0}44%{opacity:1}70%{transform:translate(-24vw,-30vh) rotate(12deg)}100%{transform:none}}
.sunp{position:absolute;right:14%;bottom:-40%;width:min(42vw,54vh);aspect-ratio:1;border-radius:50%;z-index:1;
  background:radial-gradient(#fff7c2,#ffd23f 55%,#ff9d2e);box-shadow:0 0 14vh 6vh rgba(255,200,80,.55);animation:sunrise 3.2s ease-out forwards}
@keyframes sunrise{to{transform:translateY(-50vh)}}
.sc-sun .arrive{animation:rise 3.2s ease-out both} @keyframes rise{0%{transform:translateY(65vh)}100%{transform:none}}
.sc-rain .arrive{animation:materialize 3.2s ease-out both}
@keyframes materialize{0%,45%{opacity:0;filter:blur(14px) brightness(2.2);transform:scale(.8)}100%{opacity:1;filter:none;transform:none}}
.aur{position:absolute;left:-10%;right:-10%;height:16vh;filter:blur(16px);opacity:.75;z-index:1;
  background:linear-gradient(90deg,transparent,#3fe0a8,#5fb8ff,#c77bff,transparent);animation:wave 3.5s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewY(-6deg) translateY(0)}to{transform:skewY(6deg) translateY(4vh)}}
.hopcl{position:absolute;bottom:4%;width:min(20vw,26vh);z-index:2}
.sc-hop .arrive{animation:hop3 3.2s ease-in-out both}
@keyframes hop3{0%{transform:translate(-72vw,0)}14%{transform:translate(-60vw,-20vh)}28%{transform:translate(-48vw,0)}42%{transform:translate(-36vw,-20vh)}56%{transform:translate(-24vw,0)}76%{transform:translate(-8vw,-16vh)}100%{transform:none}}
.dance{position:absolute;left:0;right:0;bottom:24%;display:flex;justify-content:center;gap:.5vw;flex-wrap:wrap}
.dance .uni{width:min(17vw,23vh)}

/* journeys */
#btnTrip{width:calc(var(--u)*11);height:calc(var(--u)*11);font-size:calc(var(--u)*6);margin-left:1.2vw}
#trip,#ride,#land{padding:0;justify-content:flex-start}
#trip{padding-top:2vh}
#trip .bar,#land .bar,#ride .bar{position:absolute;top:2vh;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:0 2vw;z-index:6}
.pickgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vh 2vw;width:94vw;margin-top:12vh}
.mapgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4vh 4vw;width:88vw;margin-top:13vh}
.place{display:flex;flex-direction:column;align-items:center;gap:1.2vh;transition:transform .3s}
.place .pic{width:min(24vw,30vh);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:min(13vw,16vh);
  border:.5vh solid rgba(255,225,160,.7);box-shadow:0 0 5vh rgba(255,217,138,.45),inset 0 0 4vh rgba(255,255,255,.25);animation:float 3.4s ease-in-out infinite}
.place:nth-child(2n) .pic{animation-delay:-1.2s} .place:nth-child(3n) .pic{animation-delay:-2.1s}
.place .pn{font-size:calc(var(--u)*4);font-weight:800;color:var(--light);text-shadow:0 0 1.5vh rgba(0,0,0,.7)}
.place.chosen{transform:scale(1.15)} .place.chosen .pic{box-shadow:0 0 0 .8vh var(--gold),0 0 9vh 3vh rgba(255,201,77,.8)}
#rideWorld,#landWorld{position:absolute;inset:0;overflow:hidden}
.layer{position:absolute;left:0;top:0;width:200vw;height:100%;animation:scroll linear infinite;pointer-events:none}
.layer span{position:absolute;line-height:1}
.layer.far{opacity:.55;filter:blur(.3px)} .layer.mid{filter:drop-shadow(0 0 1.5vh rgba(255,255,255,.35))}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100vw)}}
.ground{position:absolute;left:0;right:0;bottom:0;height:16vh;background:linear-gradient(180deg,rgba(255,255,255,.0),rgba(255,255,255,.18));
  border-top-left-radius:50% 30%;border-top-right-radius:50% 30%;pointer-events:none}
.rider{position:absolute;left:12%;top:30%;width:min(30vw,40vh);z-index:3;animation:ride 1.4s ease-in-out infinite;pointer-events:none}
@keyframes ride{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3.5vh) rotate(3deg)}}
.catch{position:absolute;left:0;font-size:min(8vw,11vh);line-height:1;z-index:4;filter:drop-shadow(0 0 2vh rgba(255,240,180,.9));padding:1.5vh}
#ride .count{font-size:calc(var(--u)*5.5);font-weight:800;color:var(--gold);text-shadow:0 0 2vh rgba(255,201,77,.9)}
.whoosh{position:absolute;inset:0;z-index:7;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);animation:whoosh .7s forwards;pointer-events:none}
@keyframes whoosh{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(2.2)}}
i.fly{position:absolute;width:1vh;height:1vh;border-radius:50%;background:#fff6a0;box-shadow:0 0 2vh 1vh rgba(255,240,120,.7);animation:firefly 4s ease-in-out infinite;pointer-events:none}
@keyframes firefly{0%,100%{opacity:.2;transform:translate(0,0)}50%{opacity:1;transform:translate(3vw,-3vh)}}
.landuni{position:absolute;left:2%;bottom:6%;width:min(28vw,38vh);z-index:3}
.thing{position:absolute;transform:translate(-50%,-50%);font-size:min(12vw,15vh);line-height:1;z-index:3;padding:1vh;
  filter:drop-shadow(0 0 2.5vh rgba(255,245,210,.8));animation:float 3.2s ease-in-out infinite}
.thing.boing{animation:boing .7s ease-out}
@keyframes boing{0%{transform:translate(-50%,-50%) scale(1)}30%{transform:translate(-50%,-62%) scale(1.35) rotate(-10deg)}60%{transform:translate(-50%,-48%) scale(.92) rotate(8deg)}100%{transform:translate(-50%,-50%) scale(1)}}
#bigWord{position:fixed;left:50%;top:14vh;transform:translate(-50%,0) scale(.5);z-index:8;opacity:0;pointer-events:none;
  background:var(--stone);border-radius:calc(var(--u)*3);padding:1vh calc(var(--u)*3);font-size:calc(var(--u)*11);font-weight:800;letter-spacing:.03em;
  box-shadow:0 0 0 .7vh var(--gold),0 0 7vh 2vh rgba(255,201,77,.6)}
#bigWord.show{animation:bigword 2.4s ease-out forwards}

  {name:'Funkel',      body:'#ffffff', line:'#6b4a8f', mane:['#ff8fcf','#c38bff','#8fc7ff'], wing:'#f3e6ff', horn:['#fff3b0','#ffc94d'], hoof:'#ffd36b', extra:'star'},

  {name:'Mondschein',  body:'#eef0ff', line:'#3f4a8a', mane:['#5b6bff','#8f9bff','#c9d0ff'], wing:'#dfe4ff', horn:['#ffffff','#bfc7ff'], hoof:'#bfc7ff', extra:'moon'},

  {name:'Perle',       body:'#fbfaf6', line:'#7a7a8a', mane:['#e9e4ff','#fff0f6','#e4fbff'], wing:'#ffffff', horn:['#ffffff','#e9d6ff'], hoof:'#e9e4ff', extra:'tiara'},
  {name:'Kristall',    body:'#effcff', line:'#2f7a8a', mane:['#3fd6e8','#8ff0ff','#d6fbff'], wing:'#d9fbff', horn:['#ffffff','#7fe9ff'], hoof:'#7fe9ff', extra:'star'},
  {name:'Sonnenschein',body:'#fffde8', line:'#9a6a1a', mane:['#ff9d2e','#ffd23f','#fff27a'], wing:'#fff6c2', horn:['#fffbe0','#ffb02e'], hoof:'#ffb02e', extra:'none'},
  {name:'Schneeflocke',body:'#ffffff', line:'#5a7aa0', mane:['#a8d8ff','#d8eeff','#ffffff'], wing:'#eef8ff', horn:['#ffffff','#cfe9ff'], hoof:'#cfe9ff', extra:'snow'},
  {name:'Lavendel',    body:'#faf5ff', line:'#6a4a9a', mane:['#9a6bff','#c7a6ff','#e6d9ff'], wing:'#efe6ff', horn:['#ffffff','#c7a6ff'], hoof:'#c7a6ff', extra:'flowers'},
  {name:'Kirschblüte', body:'#fff7f9', line:'#9a4a62', mane:['#ff7aa8','#ffb3c9','#ffe0ea'], wing:'#ffe8f0', horn:['#fff4f7','#ff9cbc'], hoof:'#ff9cbc', extra:'bow'},
  {name:'Polarlicht',  body:'#f2fff8', line:'#2a6a6a', mane:['#3fe0a8','#5fb8ff','#c77bff'], wing:'#e0fff4', horn:['#ffffff','#5fe0c8'], hoof:'#5fb8ff', extra:'moon'},
  {name:'Himmelblau',  body:'#f2f8ff', line:'#2a5a9a', mane:['#3f8cff','#7fb8ff','#bfe0ff'], wing:'#dcecff', horn:['#ffffff','#7fb8ff'], hoof:'#7fb8ff', extra:'tiara'}
];
let UID=0;
function sparkleStar(x,y,r,cls,delay){
  const s=r, t=r*.28;
  return `<path class="${cls||'spk4'}" style="animation-delay:${delay||0}s;transform-origin:${x}px ${y}px" d="M${x} ${y-s} Q${x+t} ${y-t} ${x+s} ${y} Q${x+t} ${y+t} ${x} ${y+s} Q${x-t} ${y+t} ${x-s} ${y} Q${x-t} ${y-t} ${x} ${y-s}Z" fill="#fff"/>`;
}
function uniSVG(p, opt){
  opt=opt||{}; const id='u'+(++UID), L=p.line, M=p.mane;
  const lw=5;   // outline width
  /* gradient stops */
  const maneStops=M.map((c,i)=>`<stop offset="${(i/(M.length-1||1)).toFixed(2)}" stop-color="${c}"/>`).join('');
  const defs=`<defs>
    <radialGradient id="${id}b" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="${p.body}"/><stop offset="1" stop-color="${p.body}" stop-opacity=".92"/></radialGradient>
    <linearGradient id="${id}m" x1="0" y1="0" x2="1" y2="1">${maneStops}</linearGradient>
    <linearGradient id="${id}w" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="${M[0]}"/><stop offset=".3" stop-color="${p.wing}"/><stop offset=".5" stop-color="#fff"/><stop offset=".7" stop-color="${p.wing}"/><stop offset="1" stop-color="${M[M.length-1]}"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="${id}h" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${p.horn[1]}"/><stop offset="1" stop-color="${p.horn[0]}"/></linearGradient>
    <radialGradient id="${id}g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff8d6" stop-opacity=".9"/><stop offset="1" stop-color="#fff8d6" stop-opacity="0"/></radialGradient>
  </defs>`;
  /* silhouette parts (drawn twice: thick outline first, fill on top -> no inner lines) */
  const legs=[
    'M80 146 Q78 172 84 196', 'M102 150 Q102 174 106 194',   // back legs
    'M142 150 Q140 172 144 194', 'M162 146 Q182 160 176 182' // front legs, one prancing
  ];
  const bodyParts=`
    <ellipse cx="118" cy="128" rx="60" ry="35"/>
    <path d="M136 118 C146 92 164 76 178 68 L204 86 C188 98 176 116 168 136 Z"/>
    <circle cx="190" cy="66" r="28"/>
    <ellipse cx="214" cy="82" rx="20" ry="15"/>
    <path d="M174 48 L168 20 L190 40 Z" stroke-linejoin="round"/>`;
  const legStroke=(w,c)=>legs.map(d=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`).join('');
  const hooves=[[84,196],[106,194],[144,194],[176,182]].map(([x,y],i)=>`<ellipse cx="${x}" cy="${y}" rx="9" ry="6" fill="${p.hoof}" stroke="${L}" stroke-width="3" transform="rotate(${i==3?-35:0} ${x} ${y})"/>`).join('');
  /* tail + mane as flowing strands */
  const tail=[['M64 120 C30 108 14 140 28 170',17],['M64 128 C42 130 30 156 44 182',14],['M62 116 C38 94 18 102 10 126',12]];
  const mane=[['M184 40 C160 36 148 58 154 80',15],['M178 50 C154 56 142 80 150 102',14],['M170 64 C148 76 140 100 146 122',13],['M164 80 C146 96 142 116 150 134',11]];
  const strand=(arr,w0,col)=>arr.map(([d,w],i)=>`<path d="${d}" fill="none" stroke="${col||M[i%M.length]}" stroke-width="${w+(w0||0)}" stroke-linecap="round"/>`).join('');
  const shine=arr=>arr.map(([d,w])=>`<path d="${d}" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="${Math.max(2,w*.22)}" stroke-linecap="round" stroke-dasharray="14 22"/>`).join('');
  /* wings: far wing behind, near wing over the body */
  const wingPath='M118 110 C102 70 74 36 34 16 C46 36 42 46 54 56 C40 60 44 72 60 76 C46 82 52 94 68 96 C58 104 66 112 84 112 C98 120 110 118 118 110 Z';
  const feathers='M110 104 C92 84 72 62 48 40 M104 108 C86 94 70 82 54 70 M98 112 C84 104 74 98 64 94';
  const wing=(far)=>`<g class="wing${far?' far':''}" style="transform-origin:118px 110px">
      <path d="${wingPath}" fill="url(#${id}w)" stroke="${L}" stroke-width="${lw-1}" stroke-linejoin="round" ${far?'opacity=".75" transform="translate(16 -6) scale(.92)"':''}/>

    </g>`;
  /* accessories */
  let extra='';
  if(p.extra==='flowers') extra=[[176,42,'#ff7ab8'],[188,36,'#ffd24a'],[164,52,'#9a6bff']].map(([x,y,c])=>
      `<g transform="translate(${x} ${y})">${[0,72,144,216,288].map(a=>`<ellipse rx="4.5" ry="7" cy="-6" fill="${c}" stroke="${L}" stroke-width="1.2" transform="rotate(${a})"/>`).join('')}<circle r="3.5" fill="#fff6b0"/></g>`).join('');
  if(p.extra==='tiara') extra=`<path d="M170 46 L176 34 L182 42 L190 28 L196 40 L202 34 L204 48 Z" fill="#ffe27a" stroke="${L}" stroke-width="2" stroke-linejoin="round"/><circle cx="190" cy="40" r="3" fill="#ff7ab8"/>`;
  if(p.extra==='star') extra=`<path d="M100 120 l4 9 10 1 -8 6 3 10 -9 -6 -9 6 3 -10 -8 -6 10 -1z" fill="#ffe27a" stroke="${L}" stroke-width="1.6" stroke-linejoin="round" opacity=".95"/>`;
  if(p.extra==='moon') extra=`<path d="M104 116 a12 12 0 1 0 10 18 a9 9 0 1 1 -10 -18z" fill="#fff3b0" stroke="${L}" stroke-width="1.6"/>`;
  if(p.extra==='bow') extra=`<g transform="translate(58 122)"><path d="M0 0 L-12 -8 L-12 8 Z M0 0 L12 -8 L12 8 Z" fill="#ff7ab8" stroke="${L}" stroke-width="1.6" stroke-linejoin="round"/><circle r="3.5" fill="#ff9ad5" stroke="${L}" stroke-width="1.2"/></g>`;
  if(p.extra==='snow') extra=`<g transform="translate(104 128)" stroke="#9fd6ff" stroke-width="2.4" stroke-linecap="round">${[0,60,120].map(a=>`<path d="M0 -10 V10" transform="rotate(${a})"/>`).join('')}</g>`;
  /* glitter around */
  const sp=[[30,60,7],[226,30,6],[60,26,5],[232,120,6],[20,150,5],[150,20,5],[200,170,6],[110,40,4]]
     .map(([x,y,r],i)=>sparkleStar(x,y,r,'spk4',(i*.37)%2.4)).join('');
  return `<svg class="${opt.cls||'uni'}" viewBox="-6 -8 252 216" ${opt.attr||''} aria-label="${p.name}">${defs}
    <ellipse cx="120" cy="120" rx="120" ry="100" fill="url(#${id}g)" class="aura"/>
    ${wing(true)}
    <g stroke="${L}" stroke-width="${lw*2}" stroke-linejoin="round" fill="${L}">${strand(tail,lw*2,L)}${legStroke(15+lw*2,L)}${bodyParts}</g>
    ${strand(tail,0)}${shine(tail)}
    ${legStroke(15,p.body)}${hooves}
    <g fill="url(#${id}b)">${bodyParts}</g>
    ${wing(false)}
    <g stroke="${L}" stroke-width="${lw*2}" stroke-linecap="round" fill="none">${strand(mane,lw*2,L)}</g>
    ${strand(mane,0)}${shine(mane)}
    <path d="M188 42 L214 0 L204 46 Z" fill="url(#${id}h)" stroke="${L}" stroke-width="3" stroke-linejoin="round"/>
    <path d="M195 34 L207 30 M199 24 L210 20 M203 14 L212 11" stroke="${L}" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
    <path d="M192 40 C200 30 210 36 206 46" fill="none" stroke="${M[0]}" stroke-width="10" stroke-linecap="round"/>
    ${extra}
    <ellipse cx="200" cy="68" rx="7.5" ry="10" fill="#3b2a5a"/>
    <ellipse cx="202.5" cy="64" rx="3" ry="3.8" fill="#fff"/><circle cx="197.5" cy="72" r="1.6" fill="#fff"/>
    <path d="M205 59 l5 -4 M207.5 63 l6 -2.5 M193 59 l-2 -4" stroke="#3b2a5a" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="208" cy="88" rx="7" ry="4.5" fill="#ff9ac0" opacity=".6"/>
    <path d="M222 90 q5 4 10 -1" fill="none" stroke="${L}" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="228" cy="78" r="1.8" fill="${L}" opacity=".6"/>
    <g fill="#fff" opacity=".85">${[[96,140,2.2],[130,146,1.6],[118,112,1.8],[150,128,1.4],[84,124,1.5],[200,96,1.4]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>
    <g class="glitter">${sp}</g>
  </svg>`;
}
</script>

const CLIPS = {};           // key -> {text (for ElevenLabs), tts (device fallback), group}
/* Text sent to ElevenLabs. Bare syllables like "Me", "Hi", "We" get read as English words,
   so open syllables are written the German long-vowel way: Meh, Hie, Weh, Muh, Mah, Moh. */
const cap = s => s[0].toUpperCase()+s.slice(1).toLowerCase();
const LONG = {A:'ah',E:'eh',I:'ie',O:'oh',U:'uh'};
function sylVoice(s){ const v=s[s.length-1]; if(LONG[v] && (s.length===1 || (s.length===2 && !LONG[s[0]]))) return cap(s.slice(0,-1)+LONG[s[s.length-1]]); return cap(s); }
const WORD_VOICE = {WAL:'Wahl'};
const keyOf = s => s.toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss');
function reg(key,text,tts,group){ if(!CLIPS[key]) CLIPS[key]={text,tts:tts||text,group}; }
Object.entries(PROMPTS).forEach(([k,t])=>reg(k,t,t,'Ansagen'));

SETS.join('').split('').filter(L=>!VOW.includes(L)).forEach(C=>VOW.split('').forEach(V=>{
  const s=C+V; reg('silbe_'+keyOf(s), sylVoice(s), s.toLowerCase(), 'Silben'); }));
WORDS.forEach(w=>{ w.syl.forEach(s=>reg('silbe_'+keyOf(s), sylVoice(s), s.toLowerCase(),'Silben'));

let gen=0, curAudio=null, curRes=null, deVoice=null;
function pickVoice(){ try{ const v=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));
  deVoice=v.find(v=>/de[-_]DE/i.test(v.lang))||v[0]||null; }catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }catch(e){}
function stopAll(){ gen++; if(curAudio){ try{curAudio.pause()}catch(e){} curAudio=null; }
  try{speechSynthesis.cancel()}catch(e){} if(curRes){ const r=curRes; curRes=null; r(); } }
/* clips shipped with the repo: audio/<key>.mp3, listed in audio/manifest.json */
const repoClips=new Set(), repoBad=new Set();
try{ fetch('audio/manifest.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null)
  .then(m=>{ if(m&&Array.isArray(m.clips)) m.clips.forEach(k=>repoClips.add(k)); }).catch(()=>{}); }catch(e){}
function playOne(key){
  return new Promise(res=>{
    let done=false; const fin=()=>{ if(!done){done=true; if(curRes===fin)curRes=null; res();} };
    curRes=fin;
    const speak=()=>{ if(done)return;
      const text=(CLIPS[key]&&CLIPS[key].tts)||key;
      try{ const u=new SpeechSynthesisUtterance(text); u.lang='de-DE'; u.rate=.8; u.pitch=1.15; if(deVoice)u.voice=deVoice;
        u.onend=fin; u.onerror=fin; speechSynthesis.speak(u); setTimeout(fin,1500+text.length*130); }
      catch(e){ setTimeout(fin,350); } };
    const src = clipUrl[key] || (repoClips.has(key)&&!repoBad.has(key) ? 'audio/'+key+'.mp3' : null);
    if(src){
      const fromRepo=!clipUrl[key];
      const fail=()=>{ if(fromRepo){ repoBad.add(key); speak(); } else fin(); };
      try{ const a=new Audio(src); curAudio=a; a.onended=fin; a.onerror=fail;
        const p=a.play(); if(p&&p.catch)p.catch(e=>{ if(e&&e.name==='NotAllowedError') fin(); else fail(); }); }catch(e){fail()}
      setTimeout(fin,9000);
    }else speak();
  });
}
async function say(...keys){ stopAll(); const my=gen;
  for(const k of keys){ if(my!==gen) return false; await playOne(k); if(my!==gen) return false; await wait(140); }
  return my===gen; }

function openDB(){ return new Promise(res=>{ try{ const r=indexedDB.open('funkelsLesereise',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('clips'); r.onsuccess=()=>{db=r.result;res()}; r.onerror=()=>res(); }catch(e){res()} }); }
function dbAll(){ return new Promise(res=>{ if(!db)return res([]); try{ const out=[]; const c=db.transaction('clips').objectStore('clips').openCursor();
  c.onsuccess=()=>{ const cur=c.result; if(cur){out.push([cur.key,cur.value]);cur.continue()} else res(out) }; c.onerror=()=>res(out); }catch(e){res([])} }); }
function dbPut(k,blob){ return new Promise(res=>{ if(!db)return res(); try{ const t=db.transaction('clips','readwrite'); t.objectStore('clips').put(blob,k);
  t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res()} }); }
function dbClear(){ return new Promise(res=>{ if(!db)return res(); try{ const t=db.transaction('clips','readwrite'); t.objectStore('clips').clear();
  t.oncomplete=()=>res(); t.onerror=()=>res(); }catch(e){res()} }); }
function setClip(k,blob){ if(clipUrl[k]) URL.revokeObjectURL(clipUrl[k]); clipUrl[k]=URL.createObjectURL(blob); }

const TASKS={
  /* 1 — hear a sound, find the letter */
  laute(first){
    const pool=letters(); let t; do{ t=pickLetter(pool) }while(t===G.last&&pool.length>1); G.last=t;
    const k='laut_'+keyOf(t), ask=el('div','ask'); ask.appendChild(speaker([k]));
    const f=x=>dLetter(x);
    $('stage').append(ask, optionRow(shuffle([t,...others(t,pool,2)]), f, x=>x===t, (tile)=>correct(tile,[k]), ['p_nochmal',k]));
    say(...(first?['p_laute']:[]),k);
  },
  /* 2 — picture + spoken word, find the first letter */
  anlaut(first){
    const pool=letters().filter(l=>ANLAUT[l]); let t; do{ t=pickLetter(pool) }while(t===G.last&&pool.length>1); G.last=t;
    const [w,e]=rnd(ANLAUT[t]); const wk='wort_'+keyOf(w), lk='laut_'+keyOf(t);
    const ask=el('div','ask'); ask.append(el('div','bigpic',e), speaker([wk],true));
    const f=x=>dLetter(x);
    $('stage').append(ask, optionRow(shuffle([t,...others(t,letters(),2)]), f, x=>x===t, (tile)=>correct(tile,[lk,wk]), ['p_nochmal',wk]));
    say(...(first?['p_anlaut']:[]),wk);
  },
  /* 3 — slide consonant into vowel, then find the syllable */
  blend(first){
    const L=letters(), cons=L.filter(l=>!VOW.includes(l)), vows=L.filter(l=>VOW.includes(l));
    let c,v; do{ c=pickLetter(cons); v=rnd(vows) }while(c+v===G.last); G.last=c+v;
    const sk='silbe_'+keyOf(c+v), ck='laut_'+keyOf(c), vk='laut_'+keyOf(v);
    const box=el('div','blend');
    const a=el('div','tile cA',S.mixed?c.toLowerCase():c), ar=el('button','arrow round','➜'), b=el('div','tile cB',S.mixed?v.toLowerCase():v);
    box.append(a,ar,b); $('stage').append(box);
    let merged=false;
    const merge=async()=>{ if(merged||!G)return; merged=true; a.style.transform='';
      const ok=await say(ck,vk); if(!G)return; box.classList.add('merged'); await say(sk); if(!G)return; await wait(500); phase2(); };
    ar.onclick=merge; b.onclick=()=>{ if(!merged) say(vk); };
    /* drag the first tile onto the second */
    let sx=0,dx=0,drag=false;
    a.onpointerdown=e=>{ if(merged)return; drag=true; sx=e.clientX; dx=0; a.setPointerCapture(e.pointerId); a.style.transition='none'; };
    a.onpointermove=e=>{ if(!drag)return; dx=Math.max(0,e.clientX-sx); a.style.transform='translateX('+dx+'px)'; };
    a.onpointerup=a.onpointercancel=()=>{ if(!drag)return; drag=false; a.style.transition='';
      const gap=b.getBoundingClientRect().left-a.getBoundingClientRect().right;
      if(dx<8){ a.style.transform=''; say(ck); } else if(gap<a.offsetWidth*.35){ merge(); } else { a.style.transform=''; } };
    const phase2=()=>{
      $('stage').innerHTML='';
      const ask=el('div','ask'); ask.appendChild(speaker([sk]));
      const av=shuffle(vows.filter(x=>x!==v).map(x=>c+x)), ac=shuffle(cons.filter(x=>x!==c).map(x=>x+v));
      const alts=(Math.random()<.5? av.concat(ac) : ac.concat(av)).slice(0,2);
      const f=s=>'<span class="cA">'+dSyl(s[0])+'</span><span class="cB">'+dSyl(s[1])+'</span>';
      $('stage').append(ask, optionRow(shuffle([c+v,...alts]), f, s=>s===c+v, (tile)=>correct(tile,[sk]), ['p_nochmal',sk]));
      say('p_blend2',sk);
    };
    say(...(first?['p_blend']:[]));
  },
  /* 4 — read a word in coloured syllables, match the picture */
  wort(first){
    const L=letters(), ok=WORDS.filter(w=>S.level>=w.min && w.word.split('').every(ch=>L.includes(ch)));
    const fresh=ok.filter(w=>w.word.split('').some(ch=>newest().includes(ch)));

    const wk='wort_'+keyOf(t.word);
    const word=el('div','word'); word.style.setProperty('--ws',Math.min(1,6.5/t.word.length));
    t.syl.forEach((s,i)=>{ const b=el('button','tile '+(i%2?'cB':'cA'),dSyl(s,i===0));
      b.onclick=()=>{ if(!G||G.busy)return; say('silbe_'+keyOf(s)); }; word.appendChild(b); });
    const pics=shuffle([t,...shuffle(WORDS.filter(w=>w.emoji!==t.emoji)).slice(0,2)]);
    const f=w=>w.emoji; f.pic=true;
    $('stage').append(word, optionRow(pics, f, w=>w===t, (tile)=>correct(tile,[wk]), ['p_nochmal']));
    if(first) say('p_wort'); else stopAll();
  }
};

  const spawn=()=>{ if(!$('ride').classList.contains('on')) return; const c=el('button','catch',rnd(d.catchE)); const y=12+Math.random()*58;
    c.style.top=y+'vh'; R.appendChild(c); const w=innerWidth, dur=4800+Math.random()*1500, amp=(Math.random()*6+3);
    const a=c.animate([{transform:`translateX(${w*1.05}px) translateY(0)`},{transform:`translateX(${w*.7}px) translateY(-${amp}vh)`},{transform:`translateX(${w*.35}px) translateY(${amp}vh)`},
      {transform:`translateX(-${w*.1}px) translateY(0)`}],{duration:dur,easing:'linear'}); a.onfinish=()=>c.remove();
    c.onpointerdown=()=>{ trip.caught++; $('rideCount').textContent=trip.caught; chime([rnd([1047,1175,1318,1568,1760])]); glitterBurst(...centerOf(c),16,12); c.remove(); }; };
  const iv=setInterval(spawn,850); sceneT.push(iv);
  later(()=>{ const fl=el('div','whoosh'); R.appendChild(fl); },14300);
  later(()=>arrive(d),15000); }
function arrive(d){
  stopScene(); const L=$('landWorld'); L.innerHTML=''; L.style.background=d.bg;
  L.appendChild(el('div','ground'));
  if(d.fire) for(let k=0;k<18;k++){ const f=el('i','fly'); f.style.cssText=`left:${Math.random()*100}vw;top:${15+Math.random()*60}vh;animation-delay:${-Math.random()*4}s`; L.appendChild(f); }
  const u=el('button','landuni'); u.innerHTML=uniSVG(HERD[trip.uni],{cls:'uni'}); L.appendChild(u);
  u.onclick=()=>{ const v=u.querySelector('.uni'); v.classList.remove('happy'); void v.getBoundingClientRect(); v.classList.add('happy'); glitterBurst(...centerOf(v),22,16); say('u_'+keyOf(HERD[trip.uni].name)); };
  d.things.forEach(([e,w],k)=>{ const b=el('button','thing',e); const [x,y]=LANDPOS[k];
    b.style.left=x+'%'; b.style.top=y+'%'; b.style.animationDelay=(-k*.5)+'s';
    b.onclick=()=>{ b.classList.remove('boing'); void b.offsetWidth; b.classList.add('boing'); chime([1175,1568]); glitterBurst(...centerOf(b),22,16);
      const bw=$('bigWord'); bw.innerHTML=wordHTML(w); bw.classList.remove('show'); void bw.offsetWidth; bw.classList.add('show'); say('wort_'+keyOf(w)); };
    L.appendChild(b); });
  if(trip.caught>0){ const c=el('div','caughtBadge',`${d.catchE[0]} ${trip.caught}`); L.appendChild(c); }
  show('land'); later(()=>glitterBurst(innerWidth/2,innerHeight*.45,40,40),200); chime([523,659,784,1047]); say('d_'+d.id+'_an'); }
$('btnTrip').onclick=tripPick;
$('btnTripHome').onclick=goHome;
$('btnRideHome').onclick=goHome;
$('btnLandHome').onclick=()=>{ say('r_heim'); later(goHome,2600); };
$('btnLandAgain').onclick=tripPick;


/* parent gate: hold the gear for 1.5 s */
let gearT=null;
const gear=$('btnGear');
gear.onpointerdown=()=>{ gearT=setTimeout(openParent,1500); };
gear.onpointerup=gear.onpointerleave=gear.onpointercancel=()=>clearTimeout(gearT);
gear.oncontextmenu=e=>e.preventDefault();

/* ================= PARENT AREA ================= */
function clipList(onlyMissing){
  return Object.entries(CLIPS).filter(([k])=>!onlyMissing||!clipUrl[k]).map(([k,c])=>k+'.mp3\t'+c.text).join('\n');
}
const BAD=new Set(); try{ JSON.parse(localStorage.getItem(LS+'.bad')||'[]').forEach(k=>BAD.add(k)); }catch(e){}
const saveBad=()=>{ try{ localStorage.setItem(LS+'.bad',JSON.stringify([...BAD])); }catch(e){} };
function openParent(){
  stopAll(); show('parent');
  const total=Object.keys(CLIPS).length, have=Object.keys(clipUrl).length,
    inRepo=Object.keys(CLIPS).filter(k=>repoClips.has(k)).length;
  const W=$('parentWrap');
  W.innerHTML=`
  <button class="x" id="pClose" aria-label="Schließen">×</button>
  <h1>Elternbereich</h1>
  <p>Funkels Lesereise · Sterne: ${S.stars}</p>

  <h2>Buchstaben-Stufe</h2>
  <div class="box"><div class="seg" id="pLevel"></div>
    <p>Aktiv: <b>${letters().join(' ')}</b>. Die Stufe steigt automatisch nach 15 Aufgaben, die beim ersten Versuch richtig waren (aktuell ${S.streak}/15).</p></div>

  <h2>Schrift</h2>
  <div class="box"><div class="seg" id="pCase">
    <button data-v="0" class="${S.mixed?'':'sel'}">GROSSBUCHSTABEN</button>
    <button data-v="1" class="${S.mixed?'sel':''}">Groß und klein</button></div></div>

  <h2>Rundenlänge</h2>
  <div class="box"><div class="seg" id="pLen">${[3,5,8].map(n=>`<button data-v="${n}" class="${S.roundLen===n?'sel':''}">${n} Aufgaben</button>`).join('')}</div></div>

  <h2>Stimme (ElevenLabs)</h2>
  <div class="box">
    <p><b>${inRepo} von ${total}</b> Aufnahmen aus dem Repo (GitHub-Aktion „Stimmen erzeugen“), <b>${have}</b> hier auf dem Gerät importiert (haben Vorrang). Ohne Aufnahme spricht die Gerätestimme – die kann einzelne Laute nur ungenau.</p>
    <p>Dateien genau so benennen wie in der Liste (z. B. <code>laut_m.mp3</code>, <code>silbe_ma.mp3</code>, <code>wort_mama.mp3</code>) und hier alle auf einmal auswählen:</p>
    <p><input type="file" id="pFiles" accept="audio/*" multiple></p>
    <p id="pMsg"></p>
    <div class="seg"><button class="btn" id="pAll">Liste: alle</button><button class="btn" id="pMiss">Liste: nur fehlende</button>
      <button class="btn pri" id="pCopy">Liste kopieren</button></div>
    <p>Format: Dateiname ⇥ zu sprechender Text. Laute bitte gedehnt und ohne Vokal dahinter sprechen lassen („mmm“, nicht „em“).</p>
    <textarea id="pList" readonly></textarea>
    <p><button class="btn warn" id="pDelClips">Alle Aufnahmen entfernen</button></p>
  </div>

  <h2>Aufnahmen anhören und prüfen</h2>
  <div class="box">
    <div class="seg" id="pChkGrp">${['Laute','Silben','Wörter','Ansagen'].map(g=>`<button data-v="${g}">${g}</button>`).join('')}</div>
    <p>▶ antippen zum Anhören, ✗ für falsche Aufnahmen. Die markierten Namen unten kopieren und bei der GitHub-Aktion in „Nur diese Aufnahmen“ einfügen.</p>
    <div id="pChk"></div>
    <textarea id="pBad" readonly style="height:70px"></textarea>
    <div class="seg"><button class="btn pri" id="pBadCopy">Markierte kopieren</button><button class="btn" id="pBadClear">Markierungen löschen</button></div>
  </div>

  <h2>Einhörner</h2>
  <div class="box"><p>${S.herd+1} von ${HERD.length} Einhörnern gefunden. Nach jeder geschafften Runde kommt ein neues dazu.</p>
    <div class="seg" id="pHerd"><button data-v="0">Nur Funkel</button><button data-v="${HERD.length-1}">Alle zeigen</button></div></div>

  <h2>Geschichte</h2>
  <div class="box"><button class="btn" id="pStory">Geschichte noch einmal von vorn erzählen</button> <span id="pStoryMsg"></span>
    <p>Die Einleitung und die vier Orte werden beim nächsten Start wieder vorgestellt.</p></div>

  <h2>Zurücksetzen</h2>
  <div class="box"><button class="btn warn" id="pReset">Sterne, Stufe und Einhörner zurücksetzen</button> <span id="pResetMsg"></span></div>`;

  const lv=$('pLevel');
  SETS.forEach((s,i)=>{ const b=el('button',i===S.level?'sel':'', (i+1)+' · +'+s.split('').join(' ')); b.onclick=()=>{S.level=i;S.streak=0;save();openParent()}; lv.appendChild(b); });
  $('pCase').onclick=e=>{ const v=e.target.dataset.v; if(v==null)return; S.mixed=v==='1'; save(); openParent(); };
  $('pLen').onclick=e=>{ const v=e.target.dataset.v; if(v==null)return; S.roundLen=+v; save(); openParent(); };
  $('pClose').onclick=()=>{ if(!S.seen.intro) show('start'); else goHome(); };
  const ta=$('pList'); ta.value=clipList(false);
  $('pAll').onclick=()=>ta.value=clipList(false);
  $('pMiss').onclick=()=>ta.value=clipList(true);
  $('pCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(ta.value); $('pMsg').textContent='Liste kopiert.'; }
    catch(e){ ta.focus(); ta.select(); $('pMsg').textContent='Kopieren nicht erlaubt – Text ist markiert, bitte von Hand kopieren.'; } };
  $('pFiles').onchange=async e=>{ let ok=0, bad=[];
    for(const f of e.target.files){ const k=f.name.replace(/\.[^.]+$/,'').toLowerCase().trim();
      if(CLIPS[k]){ setClip(k,f); await dbPut(k,f); ok++; } else bad.push(f.name); }
    openParent(); $('pMsg').textContent=ok+' Aufnahme(n) übernommen.'+(bad.length?' Nicht erkannt: '+bad.slice(0,8).join(', ')+(bad.length>8?' …':''):''); };
  $('pDelClips').onclick=async()=>{ Object.keys(clipUrl).forEach(k=>{URL.revokeObjectURL(clipUrl[k]);delete clipUrl[k]}); await dbClear(); openParent(); };
  const showBad=()=>{ $('pBad').value=[...BAD].join(','); };
  const drawChk=g=>{ document.querySelectorAll('#pChkGrp button').forEach(b=>b.classList.toggle('sel',b.dataset.v===g));
    const box=$('pChk'); box.innerHTML='';
    Object.entries(CLIPS).filter(([,c])=>c.group===g).forEach(([k,c])=>{
      const row=el('div','',''); row.style.cssText='display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #eee';
      const pl=el('button','btn','▶'), x=el('button','btn'+(BAD.has(k)?' warn':''),'✗');
      const src=clipUrl[k]?'gerät':repoClips.has(k)?'repo':'–';
      row.append(pl, el('span','',`<b>${c.text}</b> <span style="color:#8b84a3;font-size:13px">${k} · ${src}</span>`), x);
      row.lastChild.style.marginLeft='auto';
      pl.onclick=()=>say(k);
      x.onclick=()=>{ BAD.has(k)?BAD.delete(k):BAD.add(k); x.classList.toggle('warn',BAD.has(k)); saveBad(); showBad(); };
      box.appendChild(row); }); };
  $('pChkGrp').onclick=e=>{ if(e.target.dataset.v) drawChk(e.target.dataset.v); };
  drawChk('Laute'); showBad();
  $('pBadCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText($('pBad').value); $('pBadCopy').textContent='Kopiert ✓'; }
    catch(e){ $('pBad').focus(); $('pBad').select(); } };
  $('pBadClear').onclick=()=>{ BAD.clear(); saveBad(); drawChk(document.querySelector('#pChkGrp .sel').dataset.v); showBad(); };
  $('pHerd').onclick=e=>{ const v=e.target.dataset.v; if(v==null)return; S.herd=+v; save(); openParent(); };
  $('pStory').onclick=()=>{ S.seen={}; save(); $('pStoryMsg').textContent='Wird beim nächsten Start erzählt.'; };
  $('pReset').onclick=()=>{ S.stars=0;S.level=0;S.streak=0;S.herd=0;save();openParent(); $('pResetMsg').textContent='Zurückgesetzt.'; };
}
</script>
</body>
</html>
